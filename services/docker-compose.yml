services:
  redis:
    image: redis:7-alphine
    container_name: onemarketplace-redis
    restart: unless.stopped

    environment:
      REDIS-PASSWORD: ${REDIS_PASSWORD:-onemarketplace}

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    command:
      - sh
      - -c
      - >
        exec redis-server
        --requirepass "$${REDIS_PASSWORD}"
        --appendonly yes
        --maxmemory 1gb
        --maxmemory-policy allkeys-lru
      
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  nats:
    image: nats:2.10-alphine
    container_name: onemarketplace
    restart: unless-stopped

    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    
    volumes:
      - nats_data:/data/jetstream

    command:
      - "--jetstream"
      - "--store_dir=/data/jetstream"
      - "--http_port=8222"
volumes:
  redis_data: 
  nats_data:
